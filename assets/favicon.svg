<svg xmlns="http://www.w3.org/2000/svg"     viewBox="0 0 100 100"     width="100"     height="100">  <defs>    <!-- AmbitionForge Brand Gradient -->    <linearGradient id="afGradient"                    x1="12"                    y1="88"                    x2="88"                    y2="12"                    gradientUnits="userSpaceOnUse">      <stop offset="0%"   stop-color="#1855D1"/>      <stop offset="45%"  stop-color="#1688F5"/>      <stop offset="72%"  stop-color="#20C2D5"/>      <stop offset="100%" stop-color="#13B77F"/>    </linearGradient>    <!-- Darker side gradient -->    <linearGradient id="afSide"                    x1="0"                    y1="0"                    x2="1"                    y2="1">      <stop offset="0%" stop-color="#1749B8"/>      <stop offset="100%" stop-color="#123C9B"/>    </linearGradient>  </defs>  <!-- ================================= -->  <!-- OUTER HEXAGON / FORGE FRAME       -->  <!-- ================================= -->  <path    d="M50 5       L91 28       L91 72       L50 95       L9 72       L9 28       Z"    fill="none"    stroke="url(#afGradient)"    stroke-width="7"    stroke-linejoin="round"/>  <!-- ================================= -->  <!-- LEFT CODE BRACKET <               -->  <!-- ================================= -->  <path    d="M38 32       L22 50       L38 68"    fill="none"    stroke="url(#afGradient)"    stroke-width="6"    stroke-linecap="round"    stroke-linejoin="round"/>  <!-- ================================= -->  <!-- RIGHT CODE BRACKET >              -->  <!-- ================================= -->  <path    d="M62 32       L78 50       L62 68"    fill="none"    stroke="url(#afGradient)"    stroke-width="6"    stroke-linecap="round"    stroke-linejoin="round"/>  <!-- ================================= -->  <!-- CENTRAL AMBITION ARROW             -->  <!-- ================================= -->  <path    d="M50 73       L50 35       L42 43       M50 35       L58 43"    fill="none"    stroke="url(#afGradient)"    stroke-width="6"    stroke-linecap="round"    stroke-linejoin="round"/>  <!-- ================================= -->  <!-- LOWER FORGE / FOUNDATION           -->  <!-- ================================= -->  <path    d="M42 73       L50 65       L58 73"    fill="none"    stroke="url(#afGradient)"    stroke-width="5"    stroke-linecap="round"    stroke-linejoin="round"/>  <!-- ================================= -->  <!-- INNOVATION SPARK                   -->  <!-- ================================= -->  <path    d="M50 78       L52.5 82.5       L57 85       L52.5 87.5       L50 92       L47.5 87.5       L43 85       L47.5 82.5       Z"    fill="url(#afGradient)"/></svg>
